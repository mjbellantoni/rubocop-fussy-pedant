---
FussyPedant/Ruby:
  Enabled: true

FussyPedant/Rails:
  Enabled: true

FussyPedant/RSpec:
  Enabled: true

FussyPedant/RSpec/NoWait:
  Enabled: true
  Include:
    - 'spec/**/*.rb'
    - 'test/**/*.rb'

FussyPedant/RSpec/RequestSpecOrder:
  Enabled: true
  Include:
    - 'spec/requests/**/*.rb'
  RestActions:
    - index
    - show
    - new
    - create
    - edit
    - update
    - destroy

FussyPedant/RSpec/ModelSpecDescribeFormat:
  Enabled: true
  Include:
    - 'spec/models/**/*.rb'

FussyPedant/RSpec/ModelSpecMethodOrder:
  Enabled: true
  Include:
    - 'spec/models/**/*.rb'

FussyPedant/RSpec/ServiceDescribeCall:
  Enabled: true
  Include:
    - 'spec/services/**/*.rb'

FussyPedant/Rake:
  Enabled: true

FussyPedant/FactoryBot:
  Enabled: true

FussyPedant/FactoryBot/TraitsAlphabeticalOrder:
  Enabled: true
  Include:
    - 'spec/support/factories/**/*.rb'

FussyPedant/Ruby/AttrOrder:
  Enabled: true
  Description: 'Alphabetize attribute declarations, one macro and visibility at a time.'

FussyPedant/Ruby/AttrShadowingBuiltin:
  Enabled: true
  Description: 'Do not shadow built-in methods with attr_reader/attr_accessor/attr.'
  AllowedNames: []

FussyPedant/Ruby/CommentLineLength:
  Enabled: true
  MaxColumn: 72

FussyPedant/Ruby/ConsistentArrayCoercion:
  Enabled: true
  Description: 'Use a consistent array-coercion idiom.'
  EnforcedStyle: array_coercion
  SupportedStyles:
    - array_coercion
    - logical_or

FussyPedant/Ruby/ConstantDefinitionOrder:
  Enabled: true
  Description: 'Alphabetize constant definitions within a class or module.'

FussyPedant/Ruby/GuardClausePlacement:
  Enabled: true
  Description: 'Use if/else or case/when instead of guard clause(s) before the final expression.'

FussyPedant/Ruby/InitializeAssignmentOrder:
  Enabled: true
  Description: 'Alphabetize instance variable assignments in initialize.'

FussyPedant/Ruby/MemoizationBody:
  Enabled: true
  Description: 'Extract the body of a `@foo ||= begin ... end` memoization into a named method.'

FussyPedant/Ruby/NoFilterGuardInEach:
  Enabled: true
  Description: 'Filter on the receiver instead of `next` guards inside `each`.'

FussyPedant/Ruby/NoNegatedPredicate:
  Enabled: true
  Description: 'Define an inverse predicate instead of negating a predicate.'
  # Only predicates with no inverse to call. Anything with a partner
  # (empty?/any?, blank?/present?, persisted?/new_record?) is
  # deliberately absent -- calling that partner is the point of the cop.
  AllowedMethods:
    - nil?
    - all?
    - one?
    - frozen?

FussyPedant/Ruby/NoNamespaceAssignment:
  Enabled: true
  Description: 'Do not resolve constants through a local variable.'

FussyPedant/Ruby/NoNonAsciiInComment:
  Enabled: true
  Description: 'Avoid non-ASCII characters in comments.'

FussyPedant/Ruby/NoSingleLineCaseBody:
  Enabled: true
  Description: 'Move case/when/else body to the next line.'

FussyPedant/Ruby/SinglePrivateClassMethod:
  Enabled: true
  Description: 'Use one private_class_method directive per method.'

FussyPedant/Ruby/SpaceInsidePercentArray:
  Enabled: true
  Description: 'Put a space inside the delimiters of a percent array.'

FussyPedant/Rails/AssociationOrder:
  Enabled: true
  CheckAlphabetical: true
  CheckSpacing: true
  Include:
    - 'app/models/**/*.rb'

FussyPedant/Rails/DelegateOrder:
  Enabled: true
  Description: 'Declare one method per delegate, alphabetized by target then method.'

FussyPedant/Rails/EnumOrder:
  Enabled: true
  CheckAlphabetical: true
  CheckOnePerLine: true
  Include:
    - 'app/models/**/*.rb'

FussyPedant/Rails/MigrationNameVerb:
  Enabled: true
  Description: 'Migration class names should start with a verb.'
  Include:
    - 'db/migrate/**/*.rb'
  Verbs:
    - Add
    - Remove
    - Create
    - Drop
    - Change
    - Rename
    - Backfill
    - Populate
    - Update
    - Migrate
    - Fix
    - Set
    - Reset
    - Convert
    - Replace
    - Enable
    - Disable
    - Cleanup
    - Recreate
    - Align
    - Allow
    - Consolidate
    - Deduplicate
    - Enforce
    - Increase
    - Make
    - Normalize
    - Pluralize
    - Relax
    - Reseed
    - Restore
    - Revise
    - Simplify
    - Tighten

FussyPedant/Rails/NoInlineQuery:
  Enabled: true
  Description: 'Name queries as scopes or query objects; call sites do not build queries.'
  # Relation builders. merge/except/only/with/and/or/from/lock/readonly
  # are deliberately absent: each collides with a non-ActiveRecord
  # receiver. So are pluck/pick/ids, not, none, reorder and excluding;
  # see the cop for why. Mirrored from DEFAULT_FORBIDDEN_METHODS and
  # pinned by a spec.
  ForbiddenMethods:
    - where
    - rewhere
    - joins
    - left_joins
    - left_outer_joins
    - includes
    - preload
    - eager_load
    - references
    - order
    - reverse_order
    - in_order_of
    - limit
    - offset
    - group
    - regroup
    - having
    - distinct
    - select
    - reselect
    - unscope
    - unscoped
    - strict_loading
  # Where the cop looks at all. Off Gemfile, Rakefile, config/ and
  # bin/, where these names are certainly not ActiveRecord. The leading
  # `**/` is load-bearing here for the same reason as below: without it
  # an engine's app/ and lib/ fall outside Include and the cop goes
  # silent across every engine in the app.
  Include:
    - '**/app/**/*.rb'
    - '**/lib/**/*.rb'
  # Where queries are allowed to be born. The leading `**/` is
  # load-bearing: without it an engine layout such as
  # engines/billing/app/models/order.rb goes unscoped. Consumers
  # adding a directory need `inherit_mode: merge`; both keys replace
  # rather than merge.
  Exclude:
    - '**/app/models/**/*'
    - '**/app/queries/**/*'
    - '**/app/policies/**/*'
    - '**/app/helpers/**/*'
    - '**/app/components/**/*'
    - '**/db/**/*'

FussyPedant/Rails/ScopeOrder:
  Enabled: true
  Description: 'Alphabetize scope declarations and keep them adjacent.'
  CheckAlphabetical: true
  CheckSpacing: true
  Include:
    - 'app/models/**/*.rb'

FussyPedant/Rails/ServiceCallPattern:
  Enabled: true
  ServicesDirectory: ''
  # No Include: the cop is dual-mode. It checks class structure only
  # for files under app/services (see in_services_directory?), and
  # flags `.new` on a service class from anywhere else, so scoping it
  # to app/services would disable that second rule everywhere.

FussyPedant/Rails/ControllerMethodOrder:
  Enabled: true
  Include:
    - 'app/controllers/**/*.rb'
  RestActions:
    - index
    - show
    - new
    - create
    - edit
    - update
    - destroy
